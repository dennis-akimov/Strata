name: Bug report
description: Something in Strata doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the Apple Silicon (Mac) fork of Strata. For a Windows or Linux PC, use the original: [github.com/Niko1221/Strata](https://github.com/Niko1221/Strata/issues).

        Thanks for the report.

        A security problem? Don't post it here: report it privately (see [SECURITY.md](https://github.com/dennis-akimov/Strata/blob/main/SECURITY.md)).

        Please search the [open issues](https://github.com/dennis-akimov/Strata/issues?q=is%3Aissue+state%3Aopen) first — this may already be tracked.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you got, and what you expected instead. Paste the exact error text if there is one. If there's a set of steps or commands that reproduces it, put them here too.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Strata version, Mac, macOS
      description: The engine version is on the About tab, or in `GET /v1/status` under `engine`.
      placeholder: "0.1.41 · MacBook Pro M5 Max 128 GB · macOS 26.4"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and settings
      description: The model and size, the context, whether `--mtp on` is set, and how you started it (make run, make start, a run-<model>.sh).
      placeholder: "Qwen3.8-Flash-Next Q2_0 · 131072 · MTP on · make run"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: The engine's `strata-<model>.log` from your Strata folder, and with `make start` also `strata-run.log`; with `make run`, the last lines in Terminal. Drag and drop works directly into this box. Remove any API keys or private text first.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        A couple of extras that help a lot:

        - Check the [Mac limits and warnings](https://github.com/dennis-akimov/Strata/blob/main/docs/MACOS.md#limits-and-warnings) first, many reports are already solved there.