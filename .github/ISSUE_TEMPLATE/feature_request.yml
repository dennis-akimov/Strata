name: Feature request
description: Suggest something new or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is the Apple Silicon (Mac) fork of Strata. For a Windows or Linux PC, use the original: [github.com/Niko1221/Strata](https://github.com/Niko1221/Strata/issues).

        Explain what you want in plain language.
  - type: textarea
    id: idea
    attributes:
      label: What do you want to do?
      description: Describe the goal rather than the implementation. If there's a workaround you use today, mention it.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        All of this counts: model support on a Mac, the server and API, the web app, images, MCP servers, Mac setup and installation, and performance on Apple Silicon. (Windows or Linux PCs: the original Strata, github.com/Niko1221/Strata.)