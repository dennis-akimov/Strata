<!doctype html>
<html><head><meta charset="utf-8"><title>Strata</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--acc:#0a84ff;--log:#1d1d1f;--logfg:#e5e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2c2c2e;--fg:#f5f5f7;--mute:#98989d;--line:#3a3a3c;--log:#000;--logfg:#d1d1d6}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;font:12.5px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
#bar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:nowrap;white-space:nowrap;height:44px;overflow:visible}
#bar>*{flex-shrink:0}
@media (max-width:1400px){#url{display:none}}@media (max-width:1150px){#rate,.sep{display:none}#mem{max-width:110px;overflow:hidden;text-overflow:ellipsis}}
select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}button.on{border-color:var(--acc);color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;flex:none}#phase{font-weight:600;text-transform:capitalize;min-width:62px}
#cfg{max-width:300px}.mute{color:var(--mute)}#rate{font-variant-numeric:tabular-nums;min-width:60px}
#more{position:relative}#menu{display:none;position:absolute;right:0;top:28px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:220px;box-shadow:0 6px 24px #0003}
#menu.open{display:block}#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px}#menu button:hover{background:var(--bg)}
#menu label{display:block;padding:6px 8px}
#memwrap{position:relative}#mem{cursor:pointer}#refresh{padding:2px 7px}
#mempop{display:none;position:absolute;left:0;top:28px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:380px;max-width:90vw;box-shadow:0 6px 24px #0003}
#mempop.open{display:block}
#mempop{white-space:normal}   /* the bar's nowrap would stretch the table and the note past the popover */
#popapps{padding-top:8px}#mempop .applist table{table-layout:fixed}#mempop .applist td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mempop .applist td.n{width:5.5em}#mempop .applist td.b{width:7em}#mempop h3{margin:8px 0 4px;font-size:13px}#mempop h3:first-child{margin-top:0}
#mempop .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:1px 0}
#mempop .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0}#mempop .meter span{display:block;height:100%}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
#idle h2{margin:0;font-size:20px}#note{color:#ff453a;min-height:1em}
#log{height:38%;margin:0;background:var(--log);color:var(--logfg);padding:8px 10px;overflow:auto;font:11.5px ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;display:none;border-top:1px solid var(--line)}
#log.open{display:block}body.down #log.open{flex:1;height:auto}
.chip{border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.green{border-color:#34c759;color:#248a3d}.chip.amber{border-color:#ff9f0a;color:#c27a00}.chip.red{border-color:#ff453a;color:#d70015}
#ctx{max-width:230px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:620px;width:100%;text-align:left}
.card h3{margin:0 0 6px;font-size:14px}.card .bars{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);margin:8px 0 4px;position:relative}
.bars span{display:block;height:100%}.b-w{background:#0a84ff}.b-c{background:#bf5af2}.b-k{background:#ff9f0a}
.bars i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px}.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.verdict{margin-top:6px;font-weight:600}.verdict.green{color:#248a3d}.verdict.amber{color:#c27a00}.verdict.red{color:#d70015}
#notready{font-size:12px;max-width:620px;text-align:left}#notready div{margin:2px 0}
.tips{margin-top:8px;display:flex;flex-direction:column;gap:6px}.tips div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tips code{font:11px ui-monospace,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:4px;user-select:all}
#sys{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.sw{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.sw:first-of-type{border-top:0}
.sw input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none;cursor:pointer;margin-top:1px}
.sw input:checked{background:#34c759}.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked::after{left:16px}.sw b{display:block}.sw .mute{font-size:11.5px}
.applist table{width:100%;border-collapse:collapse;margin-top:6px}.applist td{padding:4px 2px;border-top:1px solid var(--line)}
.applist td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.applist td.b{text-align:right;white-space:nowrap}
.applist button{padding:2px 8px}.applist button.force{border-color:#ff453a;color:#ff453a}
#alert{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
#alert .card{border-color:#ff453a}#alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style></head><body class="down">
<div id="bar">
  <span class="dot" id="dot"></span><span id="phase">stopped</span>
  <select id="cfg" title="run config (strata-*.json in the Strata folder; port from the config)"></select>
  <select id="ctx" title="the context window: the longest conversation the model keeps (more needs more memory)"></select>
  <select id="cache" title="conversation cache: RAM that keeps conversations another one displaced, so they come back without being read again (RAM, not the GPU's share; a running server restarts)"></select>
  <select id="par" title="agents: requests answered at once by one engine and one copy of the weights, each with its own context (more needs more memory; a running server restarts)"></select>
  <button id="refresh" title="look for models again (a new run config, a download that finished)">↻</button>
  <span id="memwrap"><span id="mem" class="chip" title="what this model needs at this context, against what this Mac has">memory …</span>
    <div id="mempop"><div id="memsum"></div><div class="applist" id="popapps"></div></div></span>
  <button class="main" id="start">Start</button><button id="stop">Stop</button><button id="restart">Restart</button>
  <span class="mute sep">|</span><button id="load">Load model</button><button id="unload">Unload</button>
  <span id="rate" class="mute"></span><span style="flex:1"></span>
  <span class="mute" id="url"></span>
  <button id="webbtn" title="a browser beside the chat (Send page to chat puts the page you read into the message box)">Web</button>
  <button id="sysbtn" title="what macOS runs that the model would rather have the memory of">System</button>
  <button id="logbtn" title="the server's output">Log</button>
  <span id="more"><button id="morebtn">More ▾</button><div id="menu">
    <button id="browser">Open in browser</button><button id="edit_config">Edit config</button>
    <button id="reveal">Show config in Finder</button><button id="engine_log">Engine log in Console</button>
    <button id="copy_key">Copy API key</button>
    <label><input type="checkbox" id="autostart"> Start the server when the app opens</label>
  </div></span>
</div>
<div id="main">
  <div id="sys" hidden><div class="card syscard"></div></div>
  <div id="alert" hidden><div class="card"><h3 id="alerttitle"></h3><div id="alerttext"></div><div class="applist"></div><div class="acts" id="alertacts"></div></div></div>
  <div id="idle"><h2 id="idletitle">The server is stopped</h2><div class="mute" id="where"></div><div id="note"></div>
    <div class="card" id="memcard" hidden></div>
    <div class="card applist" id="appscard" hidden></div>
    <div class="card syscard"></div>
    <button class="main" id="start2">Start the server</button><a href="#" id="showlog" class="mute">show the server's log</a>
    <div id="notready" class="mute"></div></div>
  <pre id="log"></pre>
</div>
<script>
const $=id=>document.getElementById(id), send=(cmd,o={})=>window.ipc.postMessage(JSON.stringify({cmd,...o}));
// the browser pane beside the chat: the Web button opens and closes it (pressed while it shows)
function webOpen(on){$('webbtn').classList.toggle('main',on);}
setTimeout(()=>{$('webbtn').onclick=()=>send('web');},0);
const COLORS={ready:'#34c759',busy:'#0a84ff',starting:'#ff9f0a',stopping:'#ff9f0a',unloaded:'#bf5af2',stopped:'#8e8e93'};
let base='',up=false;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gb=b=>b==null?'–':(b/1e9).toFixed(1)+' GB', k=c=>c>=1048576&&c%1048576===0?c/1048576+'M':c>=1024?Math.round(c/1024)+'K':c;
let mem=null,running=false;
function init(s){
  const name=c=>{const n=c.name.replace(/^strata-|\.json$/g,'');return n==='apple-afm'?"Apple's on-device model (apple-afm)":n+(c.model&&c.model!==n?' — '+c.model:'');};
  $('cfg').innerHTML=s.configs.map(c=>{const l=name(c)+(c.problem?' (not ready)':''),sh=c.name.replace(/^strata-|\.json$/g,'');
    return `<option value="${esc(c.path)}"${c.problem?' disabled':''} data-s="${esc(sh)}" data-l="${esc(l)}">${esc(l)}</option>`;}).join('')||'<option>no run config yet: make setup</option>';
  const cur=s.configs.find(c=>c.path===s.config),pn=cur?cur.parallel||1:1;
  const cm=cur&&cur.cache_mib!=null?cur.cache_mib:-1,cachev=[-1,0,205,512,1024,2048,4096,8192,16384,32768].concat([-1,0,205,512,1024,2048,4096,8192,16384,32768].includes(cm)?[]:[cm]).sort((a,b)=>a-b);
  $('cache').innerHTML=cachev.map(v=>{const g=Math.round(v/1024*10)/10;return `<option value="${v}"${v===cm?' selected':''} data-s="${v<0?'cache auto':v?'cache '+g+' GB':'no cache'}" data-l="${v<0?'conversation cache sized for this Mac (its RAM beside the model; the server log says how much)':v?`conversation cache ${g} GB of RAM: displaced conversations come back without reading them again`:'no conversation cache: a displaced conversation is read again'}"></option>`;}).join('');
  $('par').innerHTML=[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}"${n===pn?' selected':''} data-s="${n===1?'1 agent':n+' agents'}" data-l="${n===1?'1 agent: one request at a time':n+' agents at once, each with its own context'}"></option>`).join('');
  const bad=s.configs.filter(c=>c.problem);
  $('notready').innerHTML=bad.length?'<b>Not ready yet:</b>'+bad.map(c=>`<div>${esc(name(c))}: ${esc(c.problem)}</div>`).join(''):'';
  if(s.config)$('cfg').value=s.config;$('autostart').checked=s.autostart;shorten($('cfg'));shorten($('par'));shorten($('cache'));
  base=`http://127.0.0.1:${s.port}`;$('url').textContent=`127.0.0.1:${s.port}`;
  $('log').textContent='';(s.log||[]).forEach(log);
  $('where').textContent=s.server?`${s.root}`:'engine-metal/strata-server is missing: run `make server` in '+s.root;
  status({...s.status,phase:s.phase,running:s.running});
}
let cacheStat=null;
function status(s){
  if(s.conversation_cache!==undefined){cacheStat=s.conversation_cache;if($('mempop').classList.contains('open'))memsum();}
  const ph=s.phase||'stopped';const was=running;running=!!s.running;if(was!==running)send('memory');
  $('phase').textContent=ph;$('dot').style.background=COLORS[ph]||COLORS.stopped;
  $('start').disabled=running;$('start2').hidden=running;$('stop').disabled=!running||ph==='stopping';$('restart').disabled=!running;
  $('load').disabled=ph!=='unloaded';$('unload').disabled=!(ph==='ready'||ph==='busy');$('cfg').disabled=ph==='stopping';
  $('ctx').disabled=ph==='starting'||ph==='stopping';$('ctx').title=running?'changing it restarts the server':'the context window: the longest conversation the model keeps';
  for(const id of ['browser','copy_key'])$(id).disabled=!running;
  $('rate').textContent=s.tok_s!=null?`${s.tok_s} tok/s`:(s.prompt_total?`reading ${s.prompt_read}/${s.prompt_total}`:'');
  const serving=['ready','busy','unloaded'].includes(ph);
  if(serving&&!up){up=true;send('page',{tab:'monitor'});}   // the server's own page: Chat, Monitor, About
  if(!running&&up)up=false;
  $('idle').hidden=up||!$('alert').hidden||!$('sys').hidden;document.body.classList.toggle('down',!up);layout();
  $('idletitle').textContent={starting:'Starting… loading the model',stopping:'Stopping… the engine frees its memory'}[ph]||'The server is stopped';
  if(ph!=='stopped')$('note').textContent='';
}
let full=null;function layout(){const f=!up||$('log').classList.contains('open')||!$('alert').hidden||!$('sys').hidden||$('mempop').classList.contains('open');if(f!==full){full=f;send('layout',{full:f});}}
// the memory check of the selected config (the engine's --plan, and the memory free now)
function memory(m){
  mem=m;const chip=$('mem');
  if(m.afm){chip.className='chip green';chip.textContent="Apple's on-device model";chip.title=m.advice;$('ctx').innerHTML='';
    $('memcard').hidden=false;$('memcard').innerHTML=`<h3>Memory</h3><div class="verdict green">✓ ${esc(m.advice)}</div>`;return;}
  if(m.error){chip.className='chip red';chip.textContent='memory ?';chip.title=m.error;$('ctx').innerHTML='';$('memcard').hidden=false;
    $('memcard').innerHTML=`<h3>Memory</h3><div class="verdict red">${esc(m.error)}</div>`;return;}
  chip.className='chip '+m.state;   // what it needs next to what this Mac has: the GPU's share, and what is free right now
  chip.textContent=`${gb(m.need).replace(' GB','')} / ${gb(m.limit)}`+(m.state==='green'?'':' ⚠');   // needs / the GPU's share
  chip.title=`needs ${gb(m.need)} · GPU has ${gb(m.limit)}`+(m.avail!=null?` · ${gb(m.avail)} free`:'')+` · ${m.advice} (click for this Mac's memory)`;
  memsum();
  $('ctx').innerHTML=m.options.map(o=>`<option value="${o.ctx}" data-b="${o.batch512?1:0}"${o.ctx===m.context?' selected':''} data-s="${k(o.ctx)}" data-l="context ${k(o.ctx)} · ${gb(o.need)}${o.recommended?' · recommended':o.fits?'':' · too big'}${o.batch512?' (batch 512)':''}"></option>`).join('');shorten($('ctx'));
  const tot=Math.max(m.need,m.limit),pct=b=>(100*b/tot).toFixed(1)+'%';
  $('memcard').hidden=false;
  $('memcard').innerHTML=`<h3>Memory for this model at a context of ${m.context.toLocaleString()} tokens</h3>
    <div class="bars"><span class="b-w" style="width:${pct(m.weights)}"></span><span class="b-c" style="width:${pct(m.cache)}"></span><span class="b-k" style="width:${pct(m.work)}"></span><i style="left:${pct(m.limit)}" title="what the GPU may use"></i></div>
    <div class="legend"><span><b class="b-w"></b>weights ${gb(m.weights)}</span><span><b class="b-c"></b>conversation cache ${gb(m.cache)}</span><span><b class="b-k"></b>work buffers ${gb(m.work)}</span>
    <span>│ the GPU can use ${gb(m.limit)}</span>${m.avail!=null?`<span>free now ${gb(m.avail)}</span>`:''}</div>
    <div class="verdict ${m.state}">${m.state==='green'?'✓ ':'⚠ '}${esc(m.advice)}</div>
    ${m.recommended&&m.recommended.ctx!==m.context?`<div class="acts" style="margin-top:8px"><button id="userec">Use context ${k(m.recommended.ctx)}${m.recommended.batch512?' with batch 512':''} (${gb(m.recommended.need)})</button></div>`:''}`;
  $('memcard').insertAdjacentHTML('beforeend',tips(m));
  if($('userec'))$('userec').onclick=()=>setCtx(m.recommended);
  if(m.state!=='green'||m.avail!=null&&m.need>m.avail*0.9)send('apps');else for(const el of document.querySelectorAll('.applist:not(#popapps)'))el.hidden=true;
}
// the apps using the most memory: Quit asks the app (it may ask to save), Force quit ends it (unsaved work is lost)
let appsList=[],stillRunning=null,sysMem=null,strataMem=null;
function apps(a){
  appsList=a.apps||[];if(a.still)stillRunning=a.still;if(a.sys){sysMem=a.sys;strataMem=a.strata;memsum();}
  const need=mem&&mem.avail!=null&&mem.need>mem.avail?mem.need-mem.avail:0;
  const html=!appsList.length?'':`<h3>${need?`Free ${gb(need)}: quit apps you do not need`:'Apps using the most memory'}</h3>
    <table>${appsList.map((x,i)=>`<tr><td title="${esc(x.name)}">${esc(x.name)}</td><td class="n">${gb(x.bytes)}</td><td class="b">`+
      (!x.app?`<span class="mute" title="${esc(x.bundle)}: a background process, not quit from here">background</span>`
      :x.bundle===stillRunning?`<span class="mute">still open · </span><button class="force" data-i="${i}" data-f="1">Force quit</button>`
                              :`<button data-i="${i}">Quit</button>`)+`</td></tr>`).join('')}</table>
    <div class="mute" style="margin-top:6px">Quit asks the app to close (it may ask to save your work); background services
    (servers, other models) are only shown: stop them their own way if you can.  Free memory is checked again after each.</div>`;
  for(const el of document.querySelectorAll('.applist')){el.innerHTML=html;el.hidden=!html||(el.id==='appscard'&&!need);}
}
document.addEventListener('click',e=>{const b=e.target.closest('.applist button');if(!b)return;const x=appsList[+b.dataset.i];if(!x)return;
  if(b.dataset.f&&!confirm(`Force quit ${x.name}? Unsaved work in it is lost.`))return;
  b.disabled=true;b.textContent=b.dataset.f?'Ending…':'Quitting…';if(b.dataset.f)stillRunning=null;
  send('quit_app',{bundle:x.bundle,pid:x.pid,force:!!b.dataset.f});});
// the chip's popover: this model against the GPU, Strata's processes now, and the whole Mac as Activity Monitor shows it
function memsum(){
  const m=mem||{},s=sysMem,row=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
  let h=`<h3>Strata</h3>`+(m.need!=null?row(`this model at context ${k(m.context||0)}`,gb(m.need))+row('the GPU can use',gb(m.limit)):'')+
    (strataMem!=null?row('Strata\'s processes (its GPU memory is in wired)',gb(strataMem)):'')+
    (cacheStat&&cacheStat.enabled?row('conversation cache (RAM)',`${gb(cacheStat.bytes||0).replace(' GB','')} / ${Math.round(cacheStat.budget_mib/1024)} GB · ${cacheStat.parked||0} kept · ${cacheStat.restores||0} back`):'');
  // the whole Mac in binary GB, as Activity Monitor and macOS's "128 GB" count it
  const gib=b=>b==null?'–':(b/2**30).toFixed(1)+' GB';
  if(s){const p=s.pressure,c=p==null?'var(--line)':p<50?'#34c759':p<80?'#ff9f0a':'#ff453a';
    h+=`<h3>This Mac · ${Math.round(s.total/2**30)} GB</h3>`+(p!=null?row('memory pressure',p+'%')+`<div class="meter"><span style="width:${p}%;background:${c}"></span></div>`:'')+
      row('apps',gib(s.app))+row('wired (macOS, the GPU)',gib(s.wired))+row('compressed',gib(s.compressed))+row('free or file cache',gib(s.free))+
      (s.swap_total?row('swap',`${gib(s.swap_used)} of ${gib(s.swap_total)}`):'');}
  $('memsum').innerHTML=h;
}
// what else would let it fit or run faster: macOS's GPU memory limit, the energy mode (one click each: macOS asks
// for an administrator's password; the Terminal command beside it for those who prefer it)
function tips(m){
  const t=[],pw=m.power||{};
  if(m.suggest_limit_mb)t.push(`<div>⚡ macOS lets the GPU hold ${gb(m.limit)}${m.wired_mb?'':' by default'}; this model needs ${gb(m.gpu_need)}.
    <button data-tip="raise_limit" data-mb="${m.suggest_limit_mb}">Raise it to ${(m.suggest_limit_mb/1024).toFixed(1)} GB</button>
    <span class="mute">until the Mac restarts · <code>sudo sysctl iogpu.wired_limit_mb=${m.suggest_limit_mb}</code> · keep other apps closed</span></div>`);
  if(pw.low)t.push(`<div>🐢 Low Power Mode is on: it slows the GPU. <button data-tip="low_power_off">Turn it off</button>
    <span class="mute"><code>sudo pmset -a lowpowermode 0</code></span></div>`);
  if(pw.high_capable&&!pw.high)t.push(`<div>🚀 This Mac has High Power Mode (its fans hold the GPU's clock under long answers). <button data-tip="power_high">Turn it on</button>
    <span class="mute">System Settings › Battery › Energy Mode · <code>sudo pmset -a powermode 2</code></span></div>`);
  if(pw.battery)t.push(`<div>🔌 On battery: plug in the power adapter for full speed.</div>`);
  return t.length?`<div class="tips">${t.join('')}</div>`:'';
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-tip]');if(!b)return;
  b.disabled=true;b.textContent='Asking macOS…';send(b.dataset.tip,b.dataset.mb?{mb:+b.dataset.mb}:{});});
// the System card: macOS's own memory users, kept off by toggles (the app re-applies them while it runs)
const mb=b=>b>=1e9?(b/1e9).toFixed(1)+' GB':Math.round(b/1e6)+' MB';
function system(v){
  const gpuOn=v.gpu_daemon_mb!=null,target=v.gpu_daemon_mb||v.gpu_daemon_old_mb||v.suggest_mb;
  const row=(id,on,title,status,note)=>`<label class="sw"><input type="checkbox" data-sys="${id}"${on?' checked':''}><span><b>${title}</b>
    <span class="mute">${status}</span><br><span class="mute">${note}</span></span></label>`;
  const html=`<h3>Free memory for the model</h3>`+
    row('ai',v.keep_ai_off,'Keep Apple Intelligence &amp; Siri off',
      v.ai_running?`its on-device model runs now: ${v.ai_running} processes, ${mb(v.ai_bytes)}`:'its on-device model is not running',
      `Siri ${v.siri?'on':'off'}. Apple Intelligence's own switch is yours: System Settings opens at it. While Strata runs, it ends the model's processes when macOS starts them.`)+
    row('wallpaper',v.keep_still_wallpaper,'Keep the moving wallpaper off',
      v.aerial_running?`the moving (aerial) wallpaper runs now: ${v.aerial_running} process, ${mb(v.aerial_bytes)}`:'the moving wallpaper is not running',
      `Wallpaper ${v.aerial_running?'moving':'still'}. A still colour takes its place; while Strata runs, it ends the aerial again if one returns.`)+
    (()=>{const pw=v.power||{};return pw.high_capable
      ?row('power',!!pw.high,'High Power Mode on battery and power adapter',pw.high?'on':'off (Automatic)',
        `The fans keep the GPU's clock up through long answers. <code>sudo pmset -a powermode 2</code>; off: Automatic.`)
      :row('power',!pw.low,'Full speed on battery and power adapter (Low Power Mode off)',pw.low?'Low Power Mode is on: it slows the GPU':'Low Power Mode is off',
        `This Mac has no High Power Mode; off is its fastest. <code>sudo pmset -a lowpowermode 0</code>${pw.battery?' · on battery now: plug in for full speed':''}`);})()+
    (target?row('gpu',gpuOn,`GPU memory limit ${(target/1024).toFixed(1)} GB at every startup`,
      `the GPU may hold ${v.wired_mb?(v.wired_mb/1024).toFixed(1)+' GB now':"macOS's default now (about two thirds of the memory)"}; macOS may pin ${v.wire_cap?(v.wire_cap/1e9).toFixed(1)+' GB':'?'} in all`+
        (v.gpu_daemon_old_mb?' — <b>turn on to update it</b>: the one set up before also needs the cap below, or sound stops while a big model is loaded':''),
      `<code>sudo sysctl iogpu.wired_limit_mb=${target}</code>, and macOS's cap on pinned memory above it (<code>vm.global_user_wire_limit</code>: the GPU's + 1.5 GB, 2 GB of memory left unpinned; sound needs a little pinned), at every boot (a LaunchDaemon); off puts macOS's defaults back. macOS asks for your password.`):'')+
    `<div class="mute" style="margin-top:6px">WindowServer (the display) and the rest of macOS stay: they are macOS itself.</div>`;
  for(const el of document.querySelectorAll('.syscard'))el.innerHTML=html;
  for(const t of document.querySelectorAll('[data-sys]'))t.onchange=()=>{t.disabled=true;
    send('system_toggle',{what:t.dataset.sys,on:t.checked,mb:target||0});};
}
$('sysbtn').onclick=()=>{const open=$('sys').hidden;$('sys').hidden=!open;$('sysbtn').classList.toggle('on',open);$('idle').hidden=up||open;if(open)send('system');layout();};
function setCtx(o,start){if(!o)return;send('set_context',{ctx:o.ctx,batch512:!!o.batch512,start:!!start});$('mem').textContent='memory …';closeAlert();}
// a chat failed for memory, or the engine ended while loading: what to do, one click each
function trouble(a){
  $('alert').dataset.kind='memory';const m=a.memory||{};$('alerttitle').textContent=a.why;
  const r=m.recommended;let t='';
  if(m.error)t=esc(m.error);
  else t=`At a context of ${(m.context||0).toLocaleString()} tokens this model needs ${gb(m.need)}; the GPU can use ${gb(m.limit)}${m.avail!=null?' and '+gb(m.avail)+' is free now':''}. ${esc(m.advice)}.`;
  $('alerttext').innerHTML=t+(m.error?'':tips(m));
  const acts=[];
  if(r&&r.ctx<m.context)acts.push(`<button class="main" data-a="rec">Use context ${k(r.ctx)}${r.batch512?' with batch 512':''} and restart</button>`);
  else if(m.options){const lo=m.options.find(o=>o.ctx<m.context&&o.fits)||m.options[0];if(lo&&lo.ctx<m.context)acts.push(`<button class="main" data-a="low" data-c="${lo.ctx}">Try context ${k(lo.ctx)} and restart</button>`);}
  if(m.avail!=null&&m.need>m.avail)acts.push(`<button data-a="apps">I closed apps: check again and Start</button>`);
  acts.push('<button data-a="log">Show the log</button><button data-a="close">Dismiss</button>');
  $('alertacts').innerHTML=acts.join('');
  $('alertacts').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a2=b.dataset.a;
    if(a2==='rec')setCtx(r,true);else if(a2==='low')setCtx({ctx:+b.dataset.c,batch512:true},true);
    else if(a2==='log'){closeAlert();if(!$('log').classList.contains('open'))$('logbtn').click();}
    else if(a2==='apps'){closeAlert();send('memory');send('start');}else closeAlert();};
  send('apps');
  $('alert').hidden=false;$('idle').hidden=true;layout();
}
// the server's page in this window: its loads, and what to do when one does not show
function pageEvent(e){
  if(e.event==='started'||e.event==='finished')return;
  if(e.event==='checked'){if(e.chars>0){if($('alert').dataset.kind==='page')closeAlert();}else pageTrouble(base,'The page loaded but shows nothing.');return;}
  log(`── the page did not open (${e.event}${e.why?': '+e.why:''}) ──`);
  pageTrouble(e.url||base,e.event==='timeout'?'The page did not load within 10 seconds.':'The page could not be loaded'+(e.why?': '+e.why:'.'));
}
function pageTrouble(url,why){
  if(!up)return;
  $('alert').dataset.kind='page';$('alerttitle').textContent="The server's page did not open in this window";
  $('alerttext').innerHTML=`${esc(why)} The server answers at <b>${esc(url)}</b>: open it in your browser, or try again here.`;
  $('alertacts').innerHTML='<button class="main" data-a="browser">Open in browser</button><button data-a="retry">Try again</button><button data-a="log">Show the log</button><button data-a="close">Dismiss</button>';
  $('alertacts').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a==='browser')send('browser');else if(a==='retry'){closeAlert();send('page',{tab:'monitor'});}
    else if(a==='log'){closeAlert();if(!$('log').classList.contains('open'))$('logbtn').click();}else closeAlert();};
  $('alert').hidden=false;$('idle').hidden=true;layout();
}
function closeAlert(){$('alert').dataset.kind='';$('alert').hidden=true;$('idle').hidden=up||!$('sys').hidden;layout();}
function log(line){const l=$('log'),end=l.scrollTop+l.clientHeight>=l.scrollHeight-20;l.append(line+'\n');
  while(l.childNodes.length>2000)l.firstChild.remove();if(end)l.scrollTop=l.scrollHeight;}
function note(m){$('note').textContent=m;if(up&&!$('log').classList.contains('open'))$('logbtn').click();log('── '+m+' ──');}
$('cfg').onchange=()=>send('select',{config:$('cfg').value});
$('refresh').onclick=()=>send('init');
// the popover needs the whole window: the bar's own view is only the bar's height while the chat shows below it
$('mem').onclick=()=>{const p=$('mempop');if(p.classList.toggle('open')){memsum();send('apps');
  p.style.left='0px';const r=p.getBoundingClientRect();if(r.right>innerWidth-8)p.style.left=Math.min(0,innerWidth-8-r.right)+'px';}layout();};   // kept inside the window
$('par').onchange=()=>{send('set_parallel',{n:+$('par').value});$('mem').textContent='memory …';};
$('cache').onchange=()=>send('set_cache',{mib:+$('cache').value});
// a picker shows the short name when closed and the whole line in its list (its width held while the list is open)
function shorten(sel){sel.style.width='';for(const o of sel.options)if(o.dataset.s!=null)o.textContent=o.dataset.s;}
function lengthen(sel){if(sel.style.width)return;sel.style.width=sel.offsetWidth+'px';for(const o of sel.options)if(o.dataset.l!=null)o.textContent=o.dataset.l;}
for(const id of ['cfg','ctx','par','cache']){const sel=$(id);sel.addEventListener('mousedown',()=>lengthen(sel));sel.addEventListener('keydown',()=>lengthen(sel));
  sel.addEventListener('change',()=>shorten(sel));sel.addEventListener('blur',()=>shorten(sel));}
$('ctx').onchange=()=>{const o=mem&&mem.options.find(o=>o.ctx===+$('ctx').value);if(o)setCtx(o);};
$('autostart').onchange=e=>send('autostart',{on:e.target.checked});
$('start2').onclick=()=>send('start');$('showlog').onclick=e=>{e.preventDefault();$('logbtn').click();};
$('logbtn').onclick=()=>{$('log').classList.toggle('open');$('logbtn').classList.toggle('on');$('log').scrollTop=1e9;layout();};
$('morebtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open');};
document.onclick=e=>{$('menu').classList.remove('open');if(!e.target.closest('#memwrap')&&$('mempop').classList.contains('open')){$('mempop').classList.remove('open');layout();}};$('menu').onclick=e=>e.stopPropagation();
for(const id of ['start','stop','restart','load','unload','browser','edit_config','reveal','engine_log','copy_key'])
  $(id).onclick=()=>{$('menu').classList.remove('open');send(id);};
send('init');send('system');
</script></body></html>
