[package]
name = "strata-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
libc = "0.2.191"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = "3.5.0"
wry = "0.57.1"

# AppKit events into the browser pane (native_input): the crates wry already builds there; elsewhere the page's own
# scripts click and type
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry"] }

# Linux: the web views go into a gtk::Fixed in the window (wry's build_gtk): X11 child windows (build_as_child) took
# no keyboard input and do not exist on Wayland
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
# the page scripts' tests drive headless Chrome over the DevTools protocol (a websocket); skipped without Chrome
tungstenite = "0.24"
