# Strata's chat in a container; the engine on the host through strata-relay (make up starts both).
# Settings: .env (copy .env.example).  The Strata folder and the models' folder are mounted at the same paths as on
# the host, so the run config's paths (tokenizer, log, models) mean the same thing on both sides.
services:
  strata-chat:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: strata-chat:local
    restart: unless-stopped
    env_file: .env
    environment:
      STRATA_ENGINE_RELAY: host.docker.internal:${RELAY_PORT:-7071}
    command: ["--engine", "strata", "--config", "${STRATA_CONFIG}", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:${CHAT_PORT:-8091}:8090"
    volumes:
      - ${STRATA_DIR}:${STRATA_DIR}
      - ${STRATA_DATA}:${STRATA_DATA}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
